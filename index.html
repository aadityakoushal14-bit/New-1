<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIND CODERS</title>
<style>
*{margin:0; padding:0; box-sizing:border-box;}
body{font-family:Arial; background:#80cbc4;}
.header{color:#ff4d4d; text-align:right; padding:8px 20px; font-weight:bold;}
.container{display:flex;}
.left{width:45%; background:#80cbc4; padding:12px; font-size:12px;}
.right{width:55%;}
.right img{width:100%; height:100vh; object-fit:cover;}
.center{text-align:center; margin-top:20px; background:white; padding:15px; border-radius:10px;}
#result{font-weight:bold; margin:8px 0;}
button{padding:8px 20px; margin-top:10px;}
button:disabled{background:gray; color:white;}
.check-row{margin:5px 0; text-align:left; padding-left:20px;}
@media(max-width:700px){.container{flex-direction:column;} .left,.right{width:100%;} .right img{height:300px;}}
</style>
</head>
<body>
<div class="header">MIND CODERS</div>
<div class="container">
<div class="left">
<b>Indore, Madhya Pradesh</b><br><br>
We are providing training Languages:<br>- Java - Python - JavaScript - HTML - CSS - React<br><br>
<b>Jobs Opportunities</b><br>- Frontend - Backend - Full Stack<br><br>

<div class="center">
<p style="color:red;">Welcome to Mind Coders!</p>
<p id="result">Hello, null! Welcome to Mind Coders.</p>
<input type="text" id="nameInput" placeholder="Enter your name" style="padding:5px; width:80%;"><br><br>

<div class="check-row">
<input type="checkbox" id="chk1"> I agree to <a href="https://policies.google.com/terms" target="_blank">Terms & Conditions</a>
</div>
<div class="check-row">
<input type="checkbox" id="chk2"> I agree to <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a>
</div>

<button id="submitBtn" disabled>Submit</button>
</div>
</div>
<div class="right">
<img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800" alt="Globe">
</div>
</div>

<script>
// Load pe naam puchna
window.onload = function(){
  let n = prompt("Enter your name:");
  if(n){ 
    document.getElementById("result").innerText = "Hello, "+n+"! Welcome to Mind Coders.";
    document.getElementById("nameInput").value = n;
  }
};

// Dono checkbox tick tabhi button ON
let c1=document.getElementById("chk1"), c2=document.getElementById("chk2"), btn=document.getElementById("submitBtn");
function checkBoth(){ btn.disabled = !(c1.checked && c2.checked); }
c1.onchange=checkBoth; c2.onchange=checkBoth;

// Submit par Google khulega
btn.onclick = function(){
  let n = document.getElementById("nameInput").value;
  if(!n){ alert("Naam likh bhai!"); return; }
  document.getElementById("result").innerText = "Hello, "+n+"! Welcome to Mind Coders.";
  window.open("https://www.google.com", "_blank");
};
</script>
</body>
</html>
